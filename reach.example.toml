# reach.example.toml
#
# Sample configuration template for Reach.
#
# Reach works zero-config out of the box using bundled baseline defaults
# (src/reach/reach.toml). To customize settings for your repository, copy
# this file to ./reach.toml in your project root:
#
#   cp reach.example.toml reach.toml
#
# All sections and settings are optional; uncomment only the keys you wish to override.

[general]
# Default agent runtime when --agent is omitted from CLI commands.
# Supported empirical evaluation choices: "antigravity-cli", "antigravity-sdk", "claude-code", "pi", "goose", "keyword"
default_agent = "antigravity-cli"

# default_agent = "claude-code"
# default_agent = "pi"
# default_agent = "goose"


[discovery]
# Project-level search order for skill directories.
# Supports "." (single SKILL.md at root), "skills" (generic project folder),
# explicit paths (e.g. ".agents/skills"), or named agent profiles ("claude-code", "cursor", "github", "pi", "goose").
precedence = [
    ".",
    "skills",
    ".agents/skills",
    "claude-code",
    "cursor",
    "github",
    "pi",
    "goose",
]

[study]
# Default parameters used by evaluation commands (`reach eval`, `reach check`, `reach optimize`, `reach sweep`).
catalog = "auto"
partial = false
rescope = false
tag = ""
# early_stop = true
# scales = [10, 25, 50, 100]
# anchor = "all"
# trusted = false

[catalog]
# Synthetic catalog generation and neighborhood sampling settings.
# choices: neighborhood, all, singleton, sweep
mode = "neighborhood"
rivals = 10
scorer = "hybrid"
seed = 0
size = 20

[check]
# Statistical quality gate thresholds for CI/CD evaluation.
budget = 50
max_misroute = 0.10
min_accuracy = 0.80
min_recall = 0.80
# Optional multi-step trajectory quality thresholds:
# min_entrypoint = 0.80
# min_reachability = 0.90
# min_efficiency = 0.80
# min_f1 = 0.85
# max_redundancy = 0.25
since = "HEAD~1"
strict = true

[diff]
# Statistical difference testing and sample size sizing parameters.
confidence = 0.95
noise_inflation = 1.265
power = 0.80

[lint]
# Validation thresholds for skill names and descriptions.
max_description_length = 1024
max_name_length = 64
min_description_length = 20

[lint.rules]
# Customize rule severities: "error", "warn", or "ignore".
description-too-short = "warn"
duplicate-capability = "warn"
duplicate-name = "error"
invalid-name-format = "error"
invalid-yaml = "error"
listing-overflow = "warn"
lockfile-drift = "warn"
missing-description = "error"
missing-name = "error"
name-mismatch = "error"
reserved-name-collision = "warn"
unresolved-declared-dependency = "warn"
unresolved-placeholder = "warn"
unbounded-attractor = "warn"

[optimize]
# Automated prompt optimization budget and exploration temperature.
budget = 30
temperature = 0.7
iterations = 1
holdout = 0.2
review = false
auto_queries = true
adversarial_count = 5
positive_count = 5
seed = 42
review_timeout = 600.0

[overlap]
# Claim extraction and overlap analysis thresholds.
claim_limit = 8
contender_band = 0.90
material_share = 0.01
min_claim_length = 3
min_claim_uses = 2

[plan]
# Execution plan parameters for retry policies and rate-limit backoff.
attempts = 5
backoff_s = 5.0
pause_s = 0.0
retries = 2

[runtime]
# Process execution timeout and runtime parameters.
agent = "antigravity-cli"
timeout_s = 200
max_turns = 3
early_exit = true
# Explicit list of environment variables stripped from agent subprocesses (overrides defaults):
# blocked_env_vars = ["AWS_SECRET_ACCESS_KEY", "GITHUB_TOKEN"]

[query]
# Query generation and adversarial drafting parameters.
adversarial_count = 1
count = 3
distinctive_idf_floor = 0.693147
top_rivals = 3

[retrieval]
# Semantic embedding and BM25 hybrid retrieval parameters.
bm25_b = 0.75
bm25_k1 = 1.5
model = "minishlab/potion-retrieval-32M"
rrf_k = 60
scorer = "hybrid"
similarity_threshold = 0.92

# Custom agent profiles or path overrides.
# Any client can declare custom local and user global skill locations:

# [agents.my-custom-agent]
# default_model = "custom-model"
# skills_dir = ".my-custom-agent/skills"
# user_skills_dir = ".my-custom-agent/skills"

# Model context windows, token ratios, and reasoning effort overrides.
# Overrides customize token sizing and reasoning effort for supported models:
#
# [models.gemini-3-8-flash]
# effort = "low"
#
# [models.claude-sonnet-5]
# chars_per_token = 3.0
# completion_window = 200_000
# context_window = 1_000_000
# effort = "low"

[registry]
# Google Cloud Agent Registry settings.
# When --project or --registry is passed, Reach connects to Agent Registry to evaluate remote skills.
# project = "your-project-id"
# location = "global"
# publisher = "cloud.google.com"
# cache_ttl_seconds = 300
